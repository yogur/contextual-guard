[project]
name = "contextual-guard"
version = "0.1.0"
description = "Contextual authorization for agent actions, powered by system one (decision) models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{name = "Abdul Rahman Al-Kibbe"}]
keywords = ["agents", "authorization", "system-one", "decision-models", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.11,<3",
    "typesafe-sdk>=0.7.2,<0.8",
    "litellm>=1.80,<2",
]

[project.urls]
Repository = "https://github.com/yogur/contextual-guard"
Documentation = "https://github.com/yogur/contextual-guard#readme"
Issues = "https://github.com/yogur/contextual-guard/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_contracts", "src/jev_guard"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE"]
core-metadata-version = "2.4"

[tool.uv.workspace]
members = ["benchmark"]

[tool.uv.sources]
contextual-guard-benchmark = {workspace = true}

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "twine>=6,<7", "contextual-guard-benchmark"]

[tool.ruff]
target-version = "py311"
src = ["src", "benchmark/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
