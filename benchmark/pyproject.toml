[project]
name = "contextual-guard-benchmark"
version = "0.1.0"
description = "Retained AgentDojo dataset and offline benchmark tools for Contextual Guard"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = []
dependencies = ["contextual-guard==0.1.0", "litellm>=1.80,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_dataset", "src/jev_llm", "src/jev_benchmark"]
core-metadata-version = "2.4"

[tool.uv.sources]
contextual-guard = {workspace = true}
